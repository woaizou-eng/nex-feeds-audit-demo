<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>信息流迁移工作台 · NEX</title>
    <style>
      :root {
        --ink: #19233b;
        --mute: #586880;
        --line: #dee4ed;
        --paper: #fff;
        --bg: #f3f5f9;
        --violet: #4d47de;
        --active: #eeeefe;
        --green: #117861;
        --blue: #3158ab;
        --sky: #edf4ff;
        --amber: #935810;
        --radius: 12px;
        --font: Inter, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.55 var(--font);
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      a,
      input,
      select {
        outline-offset: 3px;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 3px solid #7670fb;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.48;
      }
      a {
        color: var(--violet);
        text-decoration: none;
      }
      button {
        border: 0;
        background: none;
        color: inherit;
      }
      svg.ui {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        stroke-width: 1.7;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      .top {
        height: 60px;
        background: white;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 0 28px;
        position: sticky;
        top: 0;
        z-index: 5;
      }
      .brand {
        font: bold italic 28px/1 var(--font);
        letter-spacing: -2.1px;
        color: #4740d4;
      }
      .barline {
        height: 18px;
        border-left: 1px solid var(--line);
      }
      .suite {
        font-size: 14px;
        font-weight: 650;
      }
      .top-end {
        margin-left: auto;
        display: flex;
        gap: 16px;
        align-items: center;
      }
      .demo-pill {
        font-size: 12px;
        color: #55518e;
        background: #f1f0ff;
        padding: 3px 9px;
        border-radius: 5px;
      }
      .top-link {
        color: var(--mute);
        font-size: 13px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .top-link svg {
        width: 15px;
        height: 15px;
      }
      .wrap {
        min-height: calc(100vh - 60px);
        display: grid;
        grid-template-columns: 218px minmax(0, 1fr);
      }
      .rail {
        border-right: 1px solid var(--line);
        background: #fbfcfe;
        padding: 29px 14px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .rail-inner {
        position: sticky;
        top: 86px;
      }
      .rail h2 {
        color: #65738b;
        font-size: 12px;
        font-weight: 600;
        margin: 0 12px 13px;
        letter-spacing: 0.06em;
      }
      .rail nav {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .navitem {
        width: 100%;
        border-radius: 8px;
        display: flex;
        gap: 12px;
        align-items: center;
        text-align: left;
        padding: 11px 13px;
        color: #4d5970;
        font-weight: 550;
        white-space: nowrap;
      }
      .navitem:hover {
        background: #f2f3f8;
      }
      .navitem[aria-current] {
        color: var(--violet);
        background: #eae9ff;
      }
      .rail hr {
        margin: 22px 9px 12px;
        border: 0;
        border-top: 1px solid var(--line);
      }
      .rail .link {
        font-size: 13px;
        font-weight: 450;
      }
      .workspace {
        min-width: 0;
        width: 100%;
        max-width: 1480px;
        margin: 0 auto;
        padding: 28px clamp(18px, 3.25vw, 54px) 50px;
      }
      .crumb {
        color: var(--mute);
        font-size: 12px;
        margin-bottom: 14px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .crumb b {
        font-weight: 500;
        color: #3a4960;
      }
      .page-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 23px;
      }
      .page-head h1 {
        margin: 0;
        font-size: clamp(26px, 2.3vw, 34px);
        line-height: 1.25;
        letter-spacing: -0.04em;
      }
      .lead {
        margin: 7px 0 0;
        color: var(--mute);
        font-size: 14px;
      }
      .link-btn,
      .btn {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
        padding: 7px 13px;
        min-height: 34px;
        border-radius: 7px;
        font-weight: 550;
        font-size: 13px;
        white-space: nowrap;
        line-height: 1.45;
      }
      .btn {
        background: #fff;
        border: 1px solid #cbd3e1;
        color: #344157;
      }
      .btn:hover {
        background: #f8f9fc;
      }
      .btn.primary {
        background: var(--violet);
        border-color: var(--violet);
        color: white;
      }
      .btn.amber {
        color: var(--amber);
        background: #fff9ed;
        border-color: #ebd9b7;
      }
      .link-btn {
        color: var(--violet);
        padding-inline: 3px;
      }
      .link-btn:hover,
      .top-link:hover {
        text-decoration: underline;
      }
      .btn svg {
        width: 15px;
        height: 15px;
      }
      .panel {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        margin-bottom: 16px;
        overflow: hidden;
      }
      .panel-pad {
        padding: 20px 23px;
      }
      .pane-title {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        margin-bottom: 13px;
      }
      .pane-title h2,
      .panel h2 {
        font-size: 17px;
        font-weight: 650;
        line-height: 1.4;
        margin: 0;
        letter-spacing: -0.02em;
      }
      .dim,
      .sub {
        color: var(--mute);
      }
      .sub {
        font-size: 12px;
      }
      .mono {
        font-variant-numeric: tabular-nums;
        font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
      }
      .searchbar {
        display: flex;
        gap: 9px;
        align-items: center;
        flex-wrap: wrap;
      }
      .searchbox {
        min-width: 195px;
        max-width: 440px;
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        background: white;
        border: 1px solid #c7d0dd;
        padding: 0 10px;
        border-radius: 7px;
        color: #8390a3;
      }
      .searchbox input {
        border: 0;
        outline: 0;
        width: 100%;
        min-height: 35px;
        color: var(--ink);
        background: transparent;
      }
      .searchbox:focus-within {
        outline: 2px solid #a7a2ff;
      }
      .searchbox input:focus-visible {
        outline: 0;
      }
      .source-caption {
        padding: 7px 0 0;
        font-size: 12px;
        color: var(--mute);
      }
      .mapping {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 60px minmax(0, 1.16fr);
        gap: 21px;
        align-items: center;
      }
      .flowbox {
        background: #f1f6ff;
        border: 1px solid #ceddf6;
        border-radius: 10px;
        padding: 18px 20px;
      }
      .flowbox .id {
        font-size: 13px;
        color: var(--blue);
      }
      .flowbox strong {
        display: block;
        font-size: 23px;
        letter-spacing: -0.035em;
        margin: 5px 0 8px;
      }
      .flowbox .dim {
        font-size: 13px;
      }
      .flow-label {
        font-weight: 650;
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 0 0 8px;
        color: #344967;
      }
      .hops {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        color: #827ef1;
      }
      .hops svg {
        width: 32px;
        height: 22px;
      }
      .branch {
        display: grid;
        gap: 6px;
      }
      .branchrow {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px 12px;
        border: 1px solid #dad8fb;
        background: #f7f6ff;
        border-radius: 7px;
      }
      .branchrow strong {
        font-size: 14px;
      }
      .mapped-task {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 9px;
        text-align: left;
      }
      .flow-tag {
        display: inline-block;
        white-space: nowrap;
        border: 1px solid #b9ded3;
        border-radius: 999px;
        padding: 1px 8px;
        color: #11674f;
        background: #eff9f5;
        font-size: 12px;
      }
      .branchrow .sub {
        margin-left: auto;
      }
      .kicon {
        width: 29px;
        height: 29px;
        display: inline-grid;
        flex: none;
        place-items: center;
        border-radius: 7px;
        background: #e6e4fc;
        color: #514bcb;
      }
      .seg {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: #f0f2f6;
        border-radius: 8px;
        padding: 3px;
      }
      .seg button {
        min-width: 70px;
        padding: 5px 12px;
        border-radius: 5px;
        color: var(--mute);
        font-weight: 550;
      }
      .seg button[aria-pressed='true'] {
        background: #fff;
        color: var(--violet);
        box-shadow: 0 1px 3px #1d264024;
      }
      .list-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 21px 0 10px;
      }
      .list-head h2 {
        font-size: 17px;
        margin: 0;
      }
      .task-group {
        margin-bottom: 10px;
        background: white;
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
      }
      .task-group > summary,
      .stage > summary {
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        list-style: none;
      }
      .task-group summary::-webkit-details-marker {
        display: none;
      }
      .task-group > summary {
        font-weight: 650;
        padding: 13px 18px;
      }
      .task-group > summary .sub,
      .stage > summary .sub {
        margin-left: auto;
        font-weight: 450;
      }
      .chev {
        display: inline-flex;
        transform: rotate(-90deg);
        color: #69768e;
      }
      .chev svg {
        width: 14px;
        height: 14px;
      }
      details[open] > summary > .chev {
        transform: rotate(0);
      }
      .stage-wrap {
        padding: 0 16px 10px 43px;
      }
      .stage {
        border-top: 1px solid #edf0f5;
      }
      .stage > summary {
        padding: 8px 1px;
        font-size: 13px;
      }
      .stage-list {
        padding: 0 2px 8px 24px;
      }
      .entry {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 145px;
        align-items: baseline;
        gap: 10px;
        padding: 5px 0;
        border-top: 1px dashed #edf0f4;
        font-size: 13px;
        overflow-wrap: anywhere;
      }
      .entry .mono {
        font-size: 12px;
        color: var(--mute);
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .toolbar.end {
        justify-content: flex-end;
      }
      .empty {
        padding: 22px;
        text-align: center;
        color: var(--mute);
        background: #fafbfc;
        border: 1px dashed var(--line);
        border-radius: 8px;
      }
      .checks {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
        margin: 12px 0;
      }
      .check {
        border: 1px solid #cdd4df;
        padding: 6px 11px;
        border-radius: 7px;
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        background: white;
      }
      .check:has(:checked) {
        background: var(--active);
        color: var(--violet);
        border-color: #aca8fd;
      }
      input[type='checkbox'] {
        accent-color: var(--violet);
      }
      .note {
        padding: 10px 13px;
        border-radius: 7px;
        background: #f2f6fc;
        color: #40536d;
        font-size: 13px;
        overflow-wrap: anywhere;
      }
      .note.success {
        color: #126950;
        background: #edf8f3;
      }
      .note.warning {
        color: #7e581b;
        background: #fff6df;
      }
      .scope-total {
        display: flex;
        align-items: center;
        gap: 13px;
        flex-wrap: wrap;
        margin-bottom: 15px;
      }
      .number {
        font-size: 25px;
        font-weight: 650;
        letter-spacing: -0.04em;
      }
      .arrowtext {
        color: #8d98ab;
      }
      .flag {
        display: inline-block;
        background: #edf1f6;
        color: #59697d;
        padding: 2px 7px;
        border-radius: 5px;
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
      }
      .flag.live {
        background: #e4f4ed;
        color: #197252;
      }
      .flag.pending {
        background: #fff1ce;
        color: #835b14;
      }
      .flag.changed {
        background: #eeeaff;
        color: #5c44ae;
      }
      .table-scroll {
        overflow-x: auto;
      }
      .data {
        width: 100%;
        border-spacing: 0;
        border-collapse: collapse;
        font-size: 13px;
      }
      .data th,
      .data td {
        text-align: left;
        padding: 9px 12px;
        border-top: 1px solid #e7ebf1;
        vertical-align: middle;
      }
      .data th {
        background: #f6f8fb;
        font-size: 12px;
        color: #5b697f;
        font-weight: 550;
        white-space: nowrap;
      }
      .data th:first-child,
      .data td:first-child {
        padding-left: 4px;
      }
      .data tbody tr:hover {
        background: #fafbfe;
      }
      .twin {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(240px, 0.9fr);
        gap: 16px;
        align-items: start;
      }
      .ref-row {
        display: flex;
        align-items: center;
        gap: 9px;
        border-top: 1px solid var(--line);
        padding: 12px 0;
      }
      .ref-row:first-of-type {
        border-top: 0;
      }
      .ref-row strong {
        font-weight: 600;
        display: block;
      }
      .fieldline {
        display: flex;
        align-items: center;
        gap: 9px;
        flex-wrap: wrap;
        margin: 14px 0;
      }
      .fieldline select {
        background: #fff;
        border: 1px solid #c9d1de;
        border-radius: 7px;
        color: var(--ink);
        padding: 7px 10px;
      }
      .vtag {
        font-size: 12px;
        color: #6b628e;
        font-weight: 550;
      }
      .statebar {
        border-top: 1px solid var(--line);
        padding: 12px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
        background: #fbfcfe;
      }
      .filter-panel {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .filter-panel label {
        font-weight: 600;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .mobile-menu {
        display: none;
      }
      .extra-host {
        min-width: 0;
      }
      .hint {
        color: var(--mute);
        font-size: 13px;
        margin: 10px 0;
      }
      .approval {
        margin-top: 12px;
      }
      .approval h3 {
        font-size: 14px;
        margin: 0 0 4px;
      }
      .approval p {
        margin: 4px 0;
      }
      .overview-link {
        font-size: 13px;
      }
      .actions-line {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .source-mark {
        height: 22px;
        min-width: 34px;
        display: inline-grid;
        place-items: center;
        border-radius: 5px;
        background: #e4edfc;
        color: var(--blue);
        font-size: 11px;
        font-weight: 700;
      }
      .nex-mark {
        background: #edebfe;
        color: var(--violet);
      }
      .smalldiv {
        margin: 16px 0;
        border: 0;
        border-top: 1px solid var(--line);
      }
      .foot {
        margin-top: 20px;
        color: var(--mute);
        font-size: 12px;
      }
      @media (max-width: 1100px) {
        .wrap {
          grid-template-columns: 175px minmax(0, 1fr);
        }
        .rail {
          padding-inline: 9px;
        }
        .workspace {
          padding-inline: 22px;
        }
        .mapping {
          gap: 10px;
          grid-template-columns: minmax(0, 1fr) 32px minmax(0, 1.1fr);
        }
        .panel-pad {
          padding: 17px;
        }
        .branchrow .sub {
          white-space: nowrap;
        }
        .twin {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (max-width: 770px) {
        .top {
          height: 51px;
          padding: 0 15px;
          gap: 10px;
        }
        .wrap {
          display: block;
        }
        .rail {
          display: none;
        }
        .rail.open {
          display: block;
          position: fixed;
          inset: 51px 0 auto 0;
          z-index: 6;
          border-bottom: 1px solid var(--line);
          box-shadow: 0 5px 12px #19233b18;
          padding: 12px;
        }
        .rail-inner {
          position: static;
        }
        .rail.open h2 {
          display: none;
        }
        .rail.open hr {
          margin: 7px;
        }
        .mobile-menu {
          display: inline-flex;
          padding: 3px;
        }
        .workspace {
          padding: 18px 13px 35px;
        }
        .top-end {
          gap: 8px;
        }
        .top-link {
          font-size: 12px;
        }
        .suite {
          font-size: 13px;
        }
        .brand {
          font-size: 23px;
        }
        .page-head {
          align-items: flex-start;
          margin-bottom: 14px;
        }
        .page-head h1 {
          font-size: 24px;
        }
        .lead {
          font-size: 13px;
        }
        .panel-pad {
          padding: 14px;
        }
        .mapping {
          grid-template-columns: 1fr;
          gap: 9px;
        }
        .hops {
          display: none;
        }
        .flowbox {
          padding: 10px 12px;
        }
        .flowbox strong {
          font-size: 20px;
          margin: 2px 0;
        }
        .branchrow {
          padding: 7px 10px;
        }
        .twin {
          grid-template-columns: 1fr;
          gap: 0;
        }
        .crumb {
          margin-bottom: 9px;
        }
        .data td,
        .data th {
          padding: 6px 7px;
        }
        .task-group > summary {
          padding: 11px;
        }
        .stage-wrap {
          padding: 0 10px 6px 21px;
        }
        .entry {
          grid-template-columns: minmax(0, 1fr) auto;
        }
        .top-end .demo-pill {
          display: none;
        }
        .statebar {
          padding: 12px;
        }
        .branchrow .sub {
          font-size: 11px;
        }
        .top-link svg {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <button
        class="mobile-menu"
        aria-expanded="false"
        aria-controls="sidebar"
        aria-label="打开导航"
        id="menu"
      ></button
      ><a class="brand" href="#mapping" aria-label="NEX 流程映射">NEX</a><span class="barline"></span
      ><span class="suite">信息流迁移工作台</span>
      <div class="top-end">
        <span class="demo-pill">交互演示</span><a class="top-link" href="./#tasks">完整 Demo ↗</a>
      </div>
    </header>
    <div class="wrap">
      <aside id="sidebar" class="rail">
        <div class="rail-inner">
          <h2>迁移场景</h2>
          <nav id="nav" aria-label="迁移场景"></nav>
          <hr />
          <a class="navitem link" href="biz-nex-concepts.png" target="_blank" rel="noopener" id="diagram"
            >概念对照图 ↗</a
          >
        </div>
      </aside>
      <main class="workspace">
        <div class="crumb"><span>信息流审核</span><span aria-hidden="true">/</span><b id="crumb"></b></div>
        <header class="page-head">
          <div>
            <h1 id="page-title" tabindex="-1"></h1>
            <p class="lead" id="lead"></p>
          </div>
        </header>
        <div id="scene"></div>
        <div id="extra-root" class="extra-host" hidden></div>

            .join(
              '',
            )}</div></section><section class="panel"><div class="panel-pad"><div class="pane-title"><h2>${kindNames[kind]}任务的送审范围</h2><span class="flag">任务级配置</span></div><div>内容类型固定为<strong>${kindNames[kind]}</strong>，来源匹配以下任一渠道。</div><div class="checks" role="group" aria-label="纳入的送审来源">${sources.map((s) => `<label class="check"><input type="checkbox" data-source="${s}" ${draftScope.includes(s) ? 'checked' : ''}>${s}</label>`).join('')}</div><div class="sub">当前生效范围：${saved.join('、')}。</div></div><div class="statebar"><span class="sub">此处只调整数据分配，共享规则仍为 v${model.version}。</span><button id="save-scope" class="btn primary" ${same || !draftScope.length ? 'disabled' : ''}>保存${kindNames[kind]}范围</button></div></section>${flash ? `<p class="note success" role="status">${safe(flash)}</p>` : ''}${!draftScope.length ? '<p class="note warning" role="status">至少保留一个送审来源后才能保存。</p>' : ''}<section class="panel panel-pad"><div class="pane-title"><h2>样本对照</h2><span class="sub">${list.length} 条模拟送审记录</span></div><div class="scope-total"><span class="dim">进入${kindNames[kind]}任务</span><b class="number">${before}</b><span class="arrowtext">→</span><b class="number">${after}</b><span class="sub">条</span></div><div class="table-scroll"><table class="data"><thead><tr><th>内容</th><th>来源</th><th>当前生效</th><th>调整后</th></tr></thead><tbody>${list
            .map((r) => {
              const old = scopeMatches(r, saved),
                now = scopeMatches(r, draftScope);
              return `<tr><td>${r[3]}</td><td>${r[2]}</td><td>${old ? '进入' : '排除'}</td><td><span class="flag ${now !== old ? 'changed' : now ? 'live' : ''}">${now !== old ? (now ? '新增进入' : '移出范围') : now ? '进入' : '排除'}</span></td></tr>`;
            })
            .join(
              '',
            )}</tbody></table></div><hr class="smalldiv"><div class="sub">${kindNames[other]}任务独立使用「${model.scopes[other].join('、')}」渠道，本次调整对其影响为 0 条。</div></section>`;
        qs('#scene')
          .querySelectorAll('[data-kind]')
          .forEach(
            (b) =>
              (b.onclick = () => {
                kind = b.dataset.kind;
                draftScope = [...model.scopes[kind]];
                flash = '';
                renderScope();
                qs(`[data-kind="${kind}"]`).focus();
              }),
          );
        qs('#scene')
          .querySelectorAll('[data-source]')
          .forEach(
            (c) =>
              (c.onchange = () => {
                draftScope = sources.filter((x) => qs(`[data-source="${x}"]`).checked);
                flash = '';
                renderScope();
                qs(`[data-source="${c.dataset.source}"]`).focus();
              }),
          );
        qs('#save-scope').onclick = () => {
          model.scopes[kind] = [...draftScope];
          flash = `${kindNames[kind]}范围已保存。${before} → ${after} 条模拟记录进入任务，${kindNames[other]}范围和审核规则保持原配置。`;
          save();
          renderScope();
          announce(flash);
        };
      }
      let ruleRange = 'recommended',
        ruleQuery = '',
        ruleFocus = 'own';
      const dictRules = [
        { id: 'own', name: '封面清晰度', owner: '推荐审核', description: '按封面模糊分识别不清晰素材。' },
        {
          id: 'other',
          name: '商品主图完整性',
          owner: '商品审核',
          description: '公开规则，只读。用于判断商品主图是否完整。',
        },
      ];
      function renderRule() {
        const list = dictRules.filter(
          (r) =>
            (ruleRange === 'all' || r.id === 'own') &&
            (!ruleQuery || [r.name, r.owner].some((s) => s.includes(ruleQuery))),
        );
        if (!list.some((r) => r.id === ruleFocus)) ruleFocus = list[0]?.id || '';
        const results = list
          .map(
            (r) =>
              `<button class="btn ${ruleFocus === r.id ? 'primary' : ''}" data-rule-id="${r.id}" aria-pressed="${ruleFocus === r.id}">${r.name}${r.id === 'other' ? ' · 只读' : ''}</button>`,
          )
          .join('');
        qs('#scene').innerHTML =
          `<section class="panel panel-pad"><div class="pane-title"><h2>规则目录</h2><div class="seg" aria-label="可见范围"><button data-range="recommended" aria-pressed="${ruleRange === 'recommended'}">推荐审核</button><button data-range="all" aria-pressed="${ruleRange === 'all'}">全部可见</button></div></div><form class="searchbar" id="rule-search-form"><label class="searchbox">${ico('search')}<input type="search" id="rule-search" value="${safe(ruleQuery)}" aria-label="检索规则" placeholder="搜索规则或所属业务"></label><button class="btn">查询</button>${ruleQuery ? '<button type="button" class="link-btn" id="clear-rule">清除</button>' : ''}</form><div class="toolbar" style="margin-top:12px">${results || '<span class="dim">没有匹配规则。</span>'}</div></section><div id="rule-detail"></div>`;
        qs('#scene')
          .querySelectorAll('[data-range]')
          .forEach(
            (b) =>
              (b.onclick = () => {
                ruleRange = b.dataset.range;
                flash = '';
                renderRule();
              }),
          );
        qs('#rule-search-form').onsubmit = (e) => {
          e.preventDefault();
          ruleQuery = qs('#rule-search').value.trim();
          flash = '';
          renderRule();
          announce('已更新规则查询结果');
        };
        qs('#rule-search').onsearch = (e) => {
          if (!e.target.value) {
            ruleQuery = '';
            renderRule();
          }
        };
        if (qs('#clear-rule'))
          qs('#clear-rule').onclick = () => {
            ruleQuery = '';
            renderRule();
            qs('#rule-search').focus();
          };
        qs('#scene')
          .querySelectorAll('[data-rule-id]')
          .forEach(
            (b) =>
              (b.onclick = () => {
                ruleFocus = b.dataset.ruleId;
                flash = '';
                renderRule();
              }),
          );
        if (ruleFocus === 'other') {
          qs('#rule-detail').innerHTML =
            '<section class="panel panel-pad"><div class="pane-title"><h2>商品主图完整性</h2><span class="flag">只读</span></div><p>所属业务为商品审核。这条规则在当前空间公开可见，编辑权归创建方。</p><p class="sub">扩大列表的查询范围不会改变编辑权限。</p></section>';
          return;
        }
        if (ruleFocus !== 'own') return;
        const pending = model.pending,
          proposed = pending?.threshold ?? draftThreshold,
          threshold = model.threshold;
        const decision = (score, limit) => (score >= limit ? '不通过' : '通过');
        const affected = samples.filter((r) => decision(r[4], threshold) !== decision(r[4], proposed));
        qs('#rule-detail').innerHTML =
          `${flash ? `<p class="note success" role="status">${safe(flash)}</p>` : ''}<div class="twin"><section class="panel"><div class="panel-pad"><div class="pane-title"><h2>封面清晰度</h2><span class="flag live">v${model.version} 生效中</span></div><div class="sub">推荐审核 / 图片规则 · 演示阈值</div><p>封面模糊分达到阈值，机审结果记为「不通过」。</p><div class="fieldline"><span>当前阈值</span><strong class="mono">${threshold.toFixed(2)}</strong><span class="arrowtext">→</span><label for="proposed">拟调整为</label><select id="proposed" ${pending ? 'disabled' : ''}>${[0.6, 0.7, 0.8, 0.9].map((v) => `<option value="${v}" ${v === proposed ? 'selected' : ''}>${v.toFixed(2)}</option>`).join('')}</select></div></div><div class="statebar"><span class="sub">${pending ? '待审批的新版本' : '默认审批人：演示创建人、琼香'}</span><button class="btn primary" id="submit-rule" ${pending || proposed === threshold ? 'disabled' : ''}>提交审批</button></div></section><section class="panel panel-pad"><div class="pane-title"><h2>被以下子任务引用</h2><span class="sub">2 处</span></div>${Object.keys(
            kindNames,
          )
            .map(
              (k) =>
                `<div class="ref-row"><span class="kicon">${ico(k)}</span><div><strong>内容一审 · ${kindNames[k]}</strong><span class="sub">机审 / ${kindNames[k]}兜底子任务 · 生效版本 v${model.version}</span></div></div>`,
            )
            .join('')}</section></div>
${pending ? `<section class="panel panel-pad approval"><div class="pane-title"><h2>规则变更审批</h2><span class="flag pending">待审批</span></div><p>v${model.version} → v${model.version + 1}　阈值 ${threshold.toFixed(2)} → ${proposed.toFixed(2)}</p><p class="sub">默认审批人：演示创建人（算子创建人）、琼香。当前两个引用仍使用 v${model.version}。</p><div class="toolbar" style="margin-top:12px"><button id="approve-rule" class="btn primary">模拟审批通过</button><button id="reject-rule" class="btn">模拟驳回</button></div></section>` : model.lastChange ? `<section class="panel panel-pad"><div class="pane-title"><h2>最近一次审批</h2><span class="flag ${model.lastChange.status === '通过' ? 'live' : ''}">${model.lastChange.status}</span></div><div>阈值 ${model.lastChange.before.toFixed(2)} → ${model.lastChange.after.toFixed(2)}　·　当前生效 v${model.version}</div></section>` : ''}
<section class="panel panel-pad"><div class="pane-title"><h2>规则试算</h2><span class="sub">12 条固定样本 · ${affected.length} 条结论变化</span></div><div class="table-scroll"><table class="data"><thead><tr><th>样本</th><th>类型</th><th>模糊分</th><th>生效结论</th><th>拟调整后</th></tr></thead><tbody>${samples.map((r) => `<tr><td>${r[3]}</td><td>${kindNames[r[1]]}</td><td class="mono">${r[4].toFixed(2)}</td><td>${decision(r[4], threshold)}</td><td><span class="flag ${decision(r[4], proposed) !== decision(r[4], threshold) ? 'changed' : ''}">${decision(r[4], proposed)}</span></td></tr>`).join('')}</tbody></table></div></section>`;
        qs('#proposed').onchange = (e) => {
          draftThreshold = Number(e.target.value);
          flash = '';
          renderRule();
          qs('#proposed').focus();
        };
        qs('#submit-rule').onclick = () => {
          if (model.pending || proposed === threshold) return;
          model.pending = { threshold: proposed };
          save();
          flash = '已提交模拟审批。两个引用任务仍使用原阈值。';
          renderRule();
          announce(flash);
        };
        if (pending) {
          qs('#approve-rule').onclick = () => settleRule(true);
          qs('#reject-rule').onclick = () => settleRule(false);
        }
      }
      function settleRule(approved) {
        if (!model.pending) return;
        const before = model.threshold,
          after = model.pending.threshold;
        model.lastChange = { before, after, status: approved ? '通过' : '驳回' };
        if (approved) {
          model.version++;
          model.threshold = after;
        }
        model.pending = null;
        draftThreshold = model.threshold;
        save();
        flash = approved
          ? `审批通过，两处引用均已使用 v${model.version}。阈值从 ${before.toFixed(2)} 更新至 ${after.toFixed(2)}。`
          : `变更已驳回，两处引用继续使用 v${model.version}。`;
        renderRule();
        announce(flash);
      }
      switchPage(location.hash.slice(1) || 'mapping');
    </script>
  </body>
</html>
